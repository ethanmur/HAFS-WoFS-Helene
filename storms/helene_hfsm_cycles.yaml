# HAFS-M — experimental multistorm HAFS-B run for Hurricane Helene.
# Its parent tracks bundle several storms (Helene 'AL, 09' alongside 'EP, 10')
# and it emits no bare *.atcfunix, only *.atcfunix.all — so storm_id isolates
# Helene and track discovery falls back to the .all file automatically.
# NOTE: confirm run_root points at the dir holding the YYYYMMDDHH cycle subdirs
# of 00l.<cycle>.hfsb_multistorm.* files.
run_root: /work2/noaa/aoml-hafs1/ahazelto/student_data/suchit_data/helene/HFSM
model_label: HAFS-M
storm_id: AL09
data_available: true
valid_start: 2024092600
valid_end: 2024092800
landfall_time: 202409270310
best_track: /work2/noaa/aoml-hafs1/suchit/bal092024.dat
storm_name: Hurricane Helene
domain: [15.0, 42.0, -100.0, -60.0]
mask_radius_km: 500
out_dir: analysis/output/helene_hfsm_cycles
thresholds_mm: [2.54, 6.35, 12.7, 25.4, 50.8, 76.2, 101.6, 127.0, 177.8, 254.0]
ets_threshold_mm: 25.4
ets_bar_thresholds_in: [2, 4, 6, 8, 10, 12, 14, 16]
fss_thresholds_in: [1, 2]
