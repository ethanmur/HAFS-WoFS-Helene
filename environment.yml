# Conda environment for the HAFS QPF/ETS framework.
#   conda env create -f environment.yml
#   conda activate hafs
name: hafs
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - scipy
  - pyyaml
  - boto3
  - botocore
  - cfgrib
  - eccodes
  - python-eccodes
  - xarray
  - zarr
  - s3fs
  - matplotlib
  - cartopy
  - seaborn
  - pillow
  - scikit-learn
  -pytest
  # shap  # optional: SHAP importance plots; falls back to permutation importance
